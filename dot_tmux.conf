
# >>> tmux-file-picker-setup >>>
# tmux-file-picker keybindings
# Ctrl-b then Ctrl-f: fuzzy file picker (inserts @path into current pane)
bind C-f display-popup -E "tmux-file-picker"

# Ctrl-b then Ctrl-g: file picker with paths relative to git root
bind C-g display-popup -E "tmux-file-picker -g"

# Ctrl-b then Ctrl-d: pick directories instead of files
bind C-d display-popup -E "tmux-file-picker --directories"

# Ctrl-b then Ctrl-z: pick from zoxide frecent dirs, then pick files within
bind C-z display-popup -E "tmux-file-picker --zoxide"

# Ctrl-b then Ctrl-v: pick a zoxide dir and insert just the dir path
bind C-v display-popup -E "tmux-file-picker --zoxide --dir-only"
# <<< tmux-file-picker-setup <<<

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

set -g mouse on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# Show the window (workspace) name in the bottom-left tabs instead of the
# current directory. Names come from #W (set with `prefix + ,` or rename-window).
set -g @catppuccin_window_tabs_enabled on
# Keep tmux from overwriting your chosen window name with the running command.
set-window-option -g automatic-rename off

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# >>> smart-splits.nvim integration >>>
# Alt+Arrow moves between tmux panes; if the active pane is nvim, forward
# the key so smart-splits.nvim moves between its splits instead.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n M-Left  if-shell "$is_vim" 'send-keys M-Left'  'select-pane -L'
bind-key -n M-Down  if-shell "$is_vim" 'send-keys M-Down'  'select-pane -D'
bind-key -n M-Up    if-shell "$is_vim" 'send-keys M-Up'    'select-pane -U'
bind-key -n M-Right if-shell "$is_vim" 'send-keys M-Right' 'select-pane -R'
bind-key -T copy-mode-vi M-Left  select-pane -L
bind-key -T copy-mode-vi M-Down  select-pane -D
bind-key -T copy-mode-vi M-Up    select-pane -U
bind-key -T copy-mode-vi M-Right select-pane -R
# <<< smart-splits.nvim integration <<<

run '~/.tmux/plugins/tpm/tpm'
